[package]
name = "serde-interop"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1"
consensus_encoding = { git = "https://github.com/rust-bitcoin/rust-bitcoin", package = "bitcoin-consensus-encoding", features = ["serde"]}

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
